<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie de Photos Interactive et Accessible</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f9;
      color: #1a1a1a;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #111827;
    }

    #image {
      width: 600px;
      max-width: 95%;
      height: 380px;
      margin: 0 auto 30px auto;
      border: 4px solid #1f2937;
      border-radius: 8px;
      background-color: #1e3a8a;
      background-image: url('');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
    }

    .galerie {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      max-width: 950px;
      margin: 0 auto;
    }

    .preview {
      width: 140px;
      height: 100px;
      object-fit: cover;
      border: 3px solid #374151;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .preview:hover,
    .preview:focus {
      transform: scale(1.06);
      border-color: #d97706;
      outline: 4px solid #2563eb;
      outline-offset: 2px;
    }
  </style>
</head>
<body onload="ajouterTabFocus()">
  <header>
    <h1>Galerie de Photos Interactive et Accessible</h1>
    <p>Survolez une image avec la souris ou naviguez avec la touche <strong>Tab</strong> pour l'afficher en grand.</p>
  </header>

  <main>
    <div id="image" aria-live="polite">
      Survolez ou sélectionnez une image ci-dessous pour l'afficher ici.
    </div>

    <div class="galerie">
      <img class="preview"
           src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&q=80"
           alt="Vallée de Yosemite au coucher du soleil avec une rivière calme reflétant les montagnes"
           onmouseover="upDate(this)"
           onmouseleave="unDo()"
           onfocus="upDate(this)"
           onblur="unDo()">

      <img class="preview"
           src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600&q=80"
           alt="Rayons de soleil perçant à travers les nuages au-dessus d'une forêt de pins"
           onmouseover="upDate(this)"
           onmouseleave="unDo()"
           onfocus="upDate(this)"
           onblur="unDo()">

      <img class="preview"
           src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600&q=80"
           alt="Lac turquoise entouré de sommets montagneux escarpés sous un ciel bleu clair"
           onmouseover="upDate(this)"
           onmouseleave="unDo()"
           onfocus="upDate(this)"
           onblur="unDo()">

      <img class="preview"
           src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&q=80"
           alt="Sentier forestier bordé d'arbres centenaires baignés d'une lumière dorée"
           onmouseover="upDate(this)"
           onmouseleave="unDo()"
           onfocus="upDate(this)"
           onblur="unDo()">

      <img class="preview"
           src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=80"
           alt="Plage de sable fin avec des vagues douces de l'océan sous un ciel pastel"
           onmouseover="upDate(this)"
           onmouseleave="unDo()"
           onfocus="upDate(this)"
           onblur="unDo()">

      <img class="preview"
           src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&q=80"
           alt="Brume matinale enveloppant des collines verdoyantes à l'aube"
           onmouseover="upDate(this)"
           onmouseleave="unDo()"
           onfocus="upDate(this)"
           onblur="unDo()">
    </div>
  </main>

  <script>
    function ajouterTabFocus() {
      console.log("Événement onload déclenché : ajout de tabindex='0' sur les images.");
      const images = document.querySelectorAll(".preview");
      for (let i = 0; i < images.length; i++) {
        images[i].setAttribute("tabindex", "0");
      }
    }

    function upDate(previewPic) {
      const imageDiv = document.getElementById("image");
      imageDiv.style.backgroundImage = "url('" + previewPic.src + "')";
      imageDiv.innerHTML = previewPic.alt;
    }

    function unDo() {
      const imageDiv = document.getElementById("image");
      imageDiv.style.backgroundImage = "url('')";
      imageDiv.innerHTML = "Survolez ou sélectionnez une image ci-dessous pour l'afficher ici.";
    }
  </script>
</body>
</html>
